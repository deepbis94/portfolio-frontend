name: Publish Hostinger branch

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_SUPABASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_SUPABASE_STORAGE_BUCKET || 'portfolio' }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://portfolio-new.creativeventure.space' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require public Supabase env
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Set PUBLIC_SUPABASE_URL and PUBLIC_SUPABASE_ANON_KEY on the production environment, then re-run this workflow."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Push build/ to hostinger branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: hostinger
          clean: true
          commit-message: "Publish static site for Hostinger"
